name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [RelWithDebInfo]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libssl-dev

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      id: vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '594ad8871e1e8e45f8e626c015fd611163430207'

    # vcpkg keys every binary package by an ABI hash of its own, and an
    # archive whose packages no longer match that hash restores fine and is
    # then rejected one by one ("Restored 0 package(s)"), costing a full
    # source build. Enumerating what feeds that hash to mirror it in the
    # cache key does not work: keying on the runner image was too coarse
    # (a weekly image bump threw away a valid cache), keying on the MSVC
    # toolset was too narrow (two images shipping toolset 14.51.36231
    # still produced different ABI hashes). Whatever the remaining input
    # is - SDK, OS build, something else - the next one will surprise us
    # too.
    #
    # So the key does not try to predict validity. It ends in the run id,
    # which makes it unique, so the primary key never hits and the cache is
    # therefore *always* saved. That is the important part: an exact hit
    # makes actions/cache skip the save, which is how a useless entry used
    # to survive forever.
    #
    # restore-keys then brings back the most recent archive of the same
    # lineage. If its packages match, the build is a download; if they do
    # not, vcpkg rebuilds and the archive saved at the end holds both the
    # restored packages and the new ones. Two runner images in rotation
    # therefore cost one rebuild each, after which every run hits.
    #
    # The lineage prefix keeps unrelated caches apart - a dependency
    # change, a vcpkg bump or a new toolset starts a fresh one instead of
    # dragging an ever-growing archive along. The project version in
    # vcpkg.json is deliberately left out: a release bump does not change a
    # single dependency.
    - name: Compute vcpkg cache key (Windows)
      if: runner.os == 'Windows'
      id: vcpkgkey
      shell: pwsh
      run: |
        $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
        $inputs = [ordered]@{
          baseline     = $manifest.'builtin-baseline'
          dependencies = $manifest.dependencies
        } | ConvertTo-Json -Depth 10 -Compress
        $tmp = New-TemporaryFile
        Set-Content -Path $tmp -Value $inputs -NoNewline -Encoding utf8
        $deps = (Get-FileHash $tmp -Algorithm SHA256).Hash.Substring(0, 16).ToLower()
        Remove-Item $tmp

        $toolset = $null
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        if (Test-Path $vswhere) {
          $vsPath = & $vswhere -latest -products * -property installationPath
          $verFile = Join-Path $vsPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
          if ($vsPath -and (Test-Path $verFile)) {
            $toolset = (Get-Content $verFile -Raw).Trim()
          }
        }
        if (-not $toolset) {
          # fall back to the image, which changes at least as often
          $toolset = if ($env:ImageVersion) { "image$env:ImageVersion" } else { 'unknown' }
          Write-Host "::warning::MSVC toolset version not detected, keying the cache on $toolset"
        }

        $vcpkgRev = (git -C $env:VCPKG_ROOT rev-parse --short=12 HEAD).Trim()

        # CMake reads a backslash in a -D value as an escape character.
        $toolchain = ($env:VCPKG_ROOT -replace '\\', '/') + '/scripts/buildsystems/vcpkg.cmake'

        "deps=$deps"           >> $env:GITHUB_OUTPUT
        "toolset=$toolset"     >> $env:GITHUB_OUTPUT
        "vcpkgrev=$vcpkgRev"   >> $env:GITHUB_OUTPUT
        "toolchain=$toolchain" >> $env:GITHUB_OUTPUT
        Write-Host "cache key inputs: msvc=$toolset vcpkg=$vcpkgRev deps=$deps"
        Write-Host "runner image    : $env:ImageOS-$env:ImageVersion"
        Write-Host "toolchain file  : $toolchain"

    # vcpkg builds openssl, zlib and libiconv from source during the CMake
    # configure step, which dominates the Windows job. Persisting vcpkg's
    # binary packages turns that into a download on every later run.
    - name: Restore vcpkg binary cache (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg_binary_cache
        # unique per run, so this never hits and the archive is always saved
        key: vcpkg-${{ matrix.build_type }}-msvc${{ steps.vcpkgkey.outputs.toolset }}-vcpkg${{ steps.vcpkgkey.outputs.vcpkgrev }}-${{ steps.vcpkgkey.outputs.deps }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vcpkg-${{ matrix.build_type }}-msvc${{ steps.vcpkgkey.outputs.toolset }}-vcpkg${{ steps.vcpkgkey.outputs.vcpkgrev }}-${{ steps.vcpkgkey.outputs.deps }}-

    - name: Configure CMake
      env:
        VCPKG_BINARY_SOURCES: ${{ runner.os == 'Windows' && format('clear;files,{0}/vcpkg_binary_cache,readwrite', github.workspace) || '' }}
      run: >
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_TESTS=ON
        -DSUPPORT_SSL=ON
        ${{ runner.os == 'Windows' && format('-DCMAKE_TOOLCHAIN_FILE={0}', steps.vcpkgkey.outputs.toolchain) || '' }}
        ${{ runner.os == 'macOS' && '-DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl' || '' }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --extra-verbose --output-on-failure
