# Input for sample_07_config.
#
# CMUTIL_Config is a plain properties store: one "key = value" per line,
# '#' starts a comment. Values are read back with the typed accessors
# (Get / GetLong / GetDouble / GetBoolean), which parse the text on demand.

app.name = libcmutils sample
app.version = 1.0.0

server.host = 127.0.0.1
server.port = 9999
server.tls = true
server.load = 0.75

# Keys are free-form; the dotted style is only a convention.
log.level = DEBUG
